 <!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 수정</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header fw-bold">
            퀴즈 수정
        </div>

        <div class="card-body">
            <form
                    action="/quiz/update"
                    method="post"
                    th:object="${quiz}">

                <input type="hidden" name="quizId" th:field="*{quizId}">

                <div class="mb-3">
                    <label class="form-label" th:text="*{quizContent}"></label>
                    <textarea name="quizContent" rows="5" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        퀴즈 정답
                    </label>
                    <div class="form-check form-check-inline">
                        <input
                                class="form-check-input"
                                type="radio" name="quizAnswer" value="true"
                                th:checked="*{quizAnswer == true}">
                        <label class="form-check-label">
                            O
                        </label>

                    </div>

                    <div class="form-check form-check-inline">

                        <input
                                class="form-check-input"
                                type="radio" name="quizAnswer" value="false"
                                th:checked="*{quizAnswer == false}">

                        <label class="form-check-label">
                            X
                        </label>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        작성자
                    </label>

                    <input
                            type="text" name="quizWriter" class="form-control" th:value="*{quizWriter}">
                </div>

                <button
                        type="submit"
                        class="btn btn-primary">
                    수정하기
                </button>

                <a
                        href="/quiz"
                        class="btn btn-secondary">
                    돌아가기
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
